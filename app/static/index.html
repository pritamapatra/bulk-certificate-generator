<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bulk Certificate Generator</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f6f8; margin: 0; padding: 2rem 1rem; color: #1a1a1a; }
    main { max-width: 640px; margin: 0 auto; background: #fff; padding: 1.5rem 2rem; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, textarea { width: 100%; box-sizing: border-box; padding: .5rem; margin-top: .25rem; font: inherit; border: 1px solid #bbb; border-radius: 4px; }
    textarea { min-height: 180px; font-family: ui-monospace, monospace; }
    button { margin-top: 1rem; padding: .5rem 1rem; font: inherit; cursor: pointer; }
    #result { margin-top: 1rem; font-weight: 600; word-break: break-all; }
    #result.error { color: #b00020; }
    progress { width: 100%; height: 1.25rem; }
    .hint { color: #666; font-size: .875rem; margin-top: .25rem; }
  </style>
</head>
<body>
  <main>
    <h1>Bulk Certificate Generator</h1>
    <form id="job-form">
      <label for="event-name">Event name</label>
      <input id="event-name" name="event_name" type="text" maxlength="150" required>

      <label for="issue-date">Issue date</label>
      <input id="issue-date" name="issue_date" type="date" required>

      <label for="recipients">Recipients</label>
      <textarea id="recipients" name="recipients" placeholder="Asha Rao,asha@example.com"></textarea>
      <div class="hint">One recipient per line: name,email</div>

      <button type="button" id="sample-btn">Fill sample data</button>
      <button type="submit" id="submit-btn">Generate certificates</button>
    </form>
    <p id="result" role="status"></p>
    <progress id="progress" max="100" value="0" hidden></progress>
    <p id="status-text"></p>
  </main>

  <script>
    const SAMPLE = [
      "Asha Rao,asha@example.com",
      "Ravi Kumar,ravi@example.com",
      "Meera Das,meera@example.com",
      "Karan Shah,not-an-email"
    ].join("\n");

    document.getElementById("issue-date").value = new Date().toISOString().slice(0, 10);

    document.getElementById("sample-btn").addEventListener("click", function () {
      document.getElementById("recipients").value = SAMPLE;
      const ev = document.getElementById("event-name");
      if (!ev.value) ev.value = "PyData Workshop";
    });

    function parseRecipients(text) {
      return text.split("\n")
        .map(function (l) { return l.trim(); })
        .filter(function (l) { return l.length > 0; })
        .map(function (l) {
          const i = l.lastIndexOf(",");
          if (i === -1) return { name: l, email: "" };
          return { name: l.slice(0, i).trim(), email: l.slice(i + 1).trim() };
        });
    }

    function errorText(body, status) {
      if (body && typeof body.detail === "string") return body.detail;
      if (body && Array.isArray(body.detail)) {
        return body.detail.map(function (e) { return e.msg; }).join("; ");
      }
      if (status === 429) return "Too many requests. Please wait a minute and try again.";
      return "Request failed (" + status + ")";
    }

    const TERMINAL = ["COMPLETED", "COMPLETED_WITH_ERRORS", "FAILED"];
    let pollToken = 0;

    function startPolling(jobId) {
      const token = ++pollToken;
      const bar = document.getElementById("progress");
      const text = document.getElementById("status-text");
      let errors = 0;
      bar.hidden = false;
      bar.value = 0;

      async function tick() {
        if (token !== pollToken) return;
        try {
          const resp = await fetch("/api/v1/jobs/" + jobId);
          if (!resp.ok) throw new Error("status " + resp.status);
          const job = await resp.json();
          if (token !== pollToken) return;
          errors = 0;
          const done = job.succeeded + job.failed;
          const pct = job.total > 0 ? Math.round((done / job.total) * 100) : 0;
          const terminal = TERMINAL.indexOf(job.status) !== -1;
          bar.value = terminal ? 100 : pct;
          text.textContent = job.status + ": " + job.succeeded + " succeeded, " + job.failed + " failed of " + job.total;
          if (terminal) return;
        } catch (err) {
          errors += 1;
          if (errors >= 5) {
            text.textContent = "Lost contact with the server. Reload to check the job.";
            return;
          }
        }
        setTimeout(tick, 2000);
      }
      tick();
    }

    document.getElementById("job-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const result = document.getElementById("result");
      const btn = document.getElementById("submit-btn");
      result.className = "";
      result.textContent = "Submitting...";
      pollToken += 1;
      document.getElementById("progress").hidden = true;
      document.getElementById("status-text").textContent = "";
      btn.disabled = true;
      try {
        const resp = await fetch("/api/v1/jobs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            event_name: document.getElementById("event-name").value,
            issue_date: document.getElementById("issue-date").value,
            recipients: parseRecipients(document.getElementById("recipients").value)
          })
        });
        let body = null;
        try { body = await resp.json(); } catch (_) {}
        if (resp.ok) {
          result.textContent = "Job created: " + body.job_id + " (" + body.total + " recipients)";
          startPolling(body.job_id);
        } else {
          result.className = "error";
          result.textContent = errorText(body, resp.status);
        }
      } catch (err) {
        result.className = "error";
        result.textContent = "Network error. Please try again.";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
